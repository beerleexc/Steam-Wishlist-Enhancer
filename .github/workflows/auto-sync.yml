name: Auto Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点自动运行一次
  workflow_dispatch:      # 也允许你手动在Actions页面点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Autoupdate Fork Action
        uses: Shurtu-gal/autoupdate-fork-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
