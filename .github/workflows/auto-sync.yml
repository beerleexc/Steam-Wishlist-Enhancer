name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Autoupdate Fork Action
        uses: Shurtu-gal/autoupdate-fork-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
