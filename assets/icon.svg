<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 外圈深蓝径向渐变 -->
    <radialGradient id="outerBg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#155a9c" />
      <stop offset="100%" stop-color="#072142" />
    </radialGradient>

    <!-- 卡片蓝色渐变 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2777c4" />
      <stop offset="100%" stop-color="#124f96" />
    </linearGradient>

    <!-- 卡片边框高光 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fa3e6" />
      <stop offset="100%" stop-color="#0c3a76" />
    </linearGradient>

    <!-- 对勾亮青渐变 -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43eaff" />
      <stop offset="100%" stop-color="#00b7d9" />
    </linearGradient>

    <!-- 柔和阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="3.5" flood-color="#051830" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 1. 深色圆形背景 -->
  <circle cx="256" cy="256" r="224" fill="url(#outerBg)" />

  <!-- 2. 包裹卡片的白色环形圆：放大并套住卡片 -->
  <circle cx="256" cy="246" r="170" fill="none" stroke="#ffffff" stroke-width="24" filter="url(#shadow)" />

  <!-- 3. 卡片主体 -->
  <rect x="132" y="140" width="280" height="212" rx="28" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <rect x="132" y="140" width="280" height="212" rx="28" fill="none" stroke="url(#cardBorder)" stroke-width="6" />

  <!-- 4. 三条白色横线 -->
  <rect x="170" y="208" width="112" height="12" rx="6" fill="#ffffff" />
  <rect x="170" y="240" width="112" height="12" rx="6" fill="#ffffff" />
  <rect x="170" y="272" width="112" height="12" rx="6" fill="#ffffff" />

  <!-- 5. 亮青色对勾 -->
  <path d="M 260 264 L 296 296 L 352 236"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- 6. 对勾深色投影 -->
  <path d="M 260 264 L 296 296 L 352 236"
        fill="none"
        stroke="#074566"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.35"
        transform="translate(3, 4)" />
</svg>这个呢，怎么导入
